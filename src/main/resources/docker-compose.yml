version: "3.9"

services:

  postgres:
    image: postgres:17.9
    container_name: postgres-db
    restart: no

    environment:
      POSTGRES_DB: pineapple-shop-db
      POSTGRES_USER: doger_user
      POSTGRES_PASSWORD: doger_password

    ports:
      - "5432:5432"

    volumes:
      - pineapple_shop_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doger_user -d pineapple-shop-db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.13.0
    container_name: pgadmin
    restart: no

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pineapple_shop_data:
  pgadmin_data:
