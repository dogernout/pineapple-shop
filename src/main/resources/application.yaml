spring:
  application:
    name: pineapple-shop
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: pineapple-db-hikari
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
      keepalive-time: 300000
      max-lifetime: 600000
      idle-timeout: 300000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

pineapple-shop:
  token: ${BOT_TOKEN}
  admin-telegram-id: ${ADMIN_TELEGRAM_ID}

logging:
  level:
    org.hibernate:
      SQL: DEBUG
#      orm.jdbc.bind: TRACE
