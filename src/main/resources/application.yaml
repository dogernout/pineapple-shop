spring:
  application:
    name: pineapple-shop
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

pineapple-shop:
  token: ${BOT_TOKEN}
  admin-telegram-id: ${ADMIN_TELEGRAM_ID}
