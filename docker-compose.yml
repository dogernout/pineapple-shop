version: "3.9"

services:

  postgres:
    image: postgres:17.9
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: pineapple-shop-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - pineapple_shop_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  app:
    build: .
    container_name: pineapple-shop-app
    restart: unless-stopped
    # mem_limit: 512m   # по желанию, см. объяснение про MaxRAMPercentage ниже

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/pineapple-shop-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      TZ: Europe/Moscow

volumes:
  pineapple_shop_data:
    external: true
    name: resources_pineapple_shop_data
