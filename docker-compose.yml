services:

  postgres:
    image: postgres:17.9
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: pineapple-shop-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - pineapple_shop_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  app:
    build: .
    container_name: pineapple-shop-app
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/pineapple-shop-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      TZ: Europe/Moscow

  backup:
    image: postgres:17.9
    container_name: pineapple-shop-backup
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGHOST: postgres  # pg_dump env
      PGDATABASE: pineapple-shop-db  # pg_dump env
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is not set}  # pg_dump env
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}  # pg_dump env
      BACKUP_KEEP: 7
      TZ: Europe/Moscow

    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro

    entrypoint: [ "/bin/sh", "/backup.sh" ]

volumes:
  pineapple_shop_data:
    external: true
    name: resources_pineapple_shop_data
